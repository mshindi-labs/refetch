name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build, package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:package
      - run: npm run size

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  smoke:
    # Node 20 is the minimum supported runtime (engines) but Vitest 5 needs Node 22+,
    # so the built package is exercised there through the smoke script instead.
    name: Smoke (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node 20
            node: 20
          - runtime: node 24
            node: 24
          - runtime: bun
            node: 24
          - runtime: deno
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - name: Smoke (node)
        if: startsWith(matrix.runtime, 'node')
        run: node scripts/smoke.mjs
      - name: Smoke (bun)
        if: matrix.runtime == 'bun'
        run: bun scripts/smoke.mjs
      - name: Smoke (deno)
        if: matrix.runtime == 'deno'
        run: deno run --allow-net --allow-read --allow-env scripts/smoke.mjs
